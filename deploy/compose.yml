name: squad-host-manager
services:
  coordinator:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:18086:8080"
    env_file: .env
    environment:
      DataDir: /data
      Cherry__TokenFile: /secrets/cherry-token
      Ssh__KeyPath: /secrets/cherry-ssh
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
